name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev libffi-dev uuid-dev libssl-dev
        pip install --upgrade pip buildozer cython kivy minecraft-launcher-lib

    - name: Initialize Buildozer Spec
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
          sed -i 's/title = My Application/title = Minecraft Launcher/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = mclauncher/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,minecraft-launcher-lib,urllib3,requests,certifi,idna,chardet/' buildozer.spec
          sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/' buildozer.spec
        fi

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Minecraft-Java-Launcher-APK
        path: bin/*.apk
        
